<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img" aria-label="Warm restaurant scene with a serving cloche">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#431407"/><stop offset=".55" stop-color="#7c2d12"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <rect width="320" height="210" rx="18" fill="url(#bg)"/>
  <circle cx="272" cy="34" r="52" fill="#f97316" opacity=".28"/>
  <circle cx="34" cy="188" r="58" fill="#f59e0b" opacity=".18"/>
  <!-- hanging lamps -->
  <g stroke="#fdba74" stroke-width="2.4" stroke-linecap="round">
    <line x1="66" y1="0" x2="66" y2="26"/><line x1="254" y1="0" x2="254" y2="26"/>
  </g>
  <path d="M52 40a14 10 0 0 1 28 0z" fill="#fbbf24"/>
  <path d="M240 40a14 10 0 0 1 28 0z" fill="#fbbf24"/>
  <circle cx="66" cy="44" r="3.4" fill="#fff7ed"/><circle cx="254" cy="44" r="3.4" fill="#fff7ed"/>
  <!-- steam -->
  <g fill="none" stroke="#ffedd5" stroke-width="3.4" stroke-linecap="round" opacity=".9">
    <path d="M138 62c-5-7 5-10 0-17"/>
    <path d="M160 58c-5-7 5-10 0-17"/>
    <path d="M182 62c-5-7 5-10 0-17"/>
  </g>
  <!-- cloche -->
  <path d="M84 128c4-32 38-54 76-54s72 22 76 54z" fill="url(#dome)"/>
  <circle cx="160" cy="68" r="7" fill="#fff7ed"/>
  <rect x="70" y="128" width="180" height="7" rx="3.5" fill="#fff7ed"/>
  <ellipse cx="160" cy="146" rx="104" ry="12" fill="url(#plate)"/>
  <!-- side plates -->
  <ellipse cx="52" cy="152" rx="26" ry="7" fill="#fed7aa" opacity=".85"/>
  <ellipse cx="272" cy="152" rx="26" ry="7" fill="#fed7aa" opacity=".85"/>
  <circle cx="52" cy="148" r="7" fill="#f97316"/><circle cx="272" cy="148" r="7" fill="#84cc16"/>
  <!-- table -->
  <rect x="30" y="160" width="260" height="9" rx="4.5" fill="#431407" opacity=".55"/>
  <rect x="58" y="169" width="8" height="26" rx="4" fill="#431407" opacity=".45"/>
  <rect x="254" y="169" width="8" height="26" rx="4" fill="#431407" opacity=".45"/>
  <!-- sparkle garnish -->
  <g fill="#fde68a">
    <path d="M96 92l2.2 5.4 5.4 2.2-5.4 2.2L96 107.2l-2.2-5.4-5.4-2.2 5.4-2.2z"/>
    <path d="M232 84l1.7 4.2 4.2 1.7-4.2 1.7-1.7 4.2-1.7-4.2-4.2-1.7 4.2-1.7z"/>
  </g>
</svg>
